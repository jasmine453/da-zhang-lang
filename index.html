<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#23190f">
  <title>打蟑螂</title>
  <meta name="description" content="拿起顺手的工具，掀开旧锅盖，把厨房里的蟑螂收拾干净。">
  <link rel="icon" href="./assets/favicon.ico">
  <link rel="apple-touch-icon" href="./assets/touch-icon.png">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; scrollbar-width: none; background: #23190f; }
    ::-webkit-scrollbar { display: none; width: 0; height: 0; }
    body { display: grid; place-items: center; height: 100dvh; }
    iframe {
      display: block;
      width: min(430px, 100vw, calc(100dvh * 9 / 16));
      height: min(764.444px, 100dvh, calc(100vw * 16 / 9));
      border: 0;
      background: #ebdfc0;
    }
    @media (pointer: coarse) {
      body {
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      iframe { width: min(480px, 100%); height: 100%; }
    }
  </style>
</head>
<body>
  <iframe src="play.html?v=3.0.9" title="打蟑螂" allow="autoplay; fullscreen" scrolling="no"></iframe>
</body>
</html>
